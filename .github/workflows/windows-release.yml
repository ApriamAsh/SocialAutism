name: Build Windows desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - name: Publish installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Social Atlas v0.1.${{ github.run_number }}
          body: |
            Automated Windows desktop build of Social Atlas.

            **Install:** Download the Windows installer below and run it.
            This is an early preview. Your people, relationship, and event data are stored locally in the app's Electron storage.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/Social-Atlas-Setup-0.1.0.exe

name: Build Windows desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # No npm cache: this repository intentionally has no committed lockfile.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Social Atlas dependencies
        run: npm install --no-audit --no-fund

      - name: Build Social Atlas installer
        run: npm run dist:win

      - name: Install launcher dependencies
        working-directory: launcher
        run: npm install --no-audit --no-fund

      - name: Build standalone launcher installer
        working-directory: launcher
        run: npm run dist:win

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Social-Atlas-Windows-Build
          path: |
            dist/Social-Atlas-Setup-0.1.0.exe
            renderer.bundle.js
            launcher/dist/Social-Atlas-Launcher-Setup-1.0.0.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish app, launcher, and update bundle to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Social Atlas v0.1.${{ github.run_number }}
          body: |
            Automated Windows build of Social Atlas and its standalone launcher.

            - **Social-Atlas-Setup-0.1.0.exe** — Social Atlas desktop app.
            - **Social-Atlas-Launcher-Setup-1.0.0.exe** — standalone launcher with GitHub release checking, downloading, install/update, and launch controls.
            - **renderer.bundle.js** — frontend update bundle for supported in-app updates.

            Your people, relationships, and events remain stored locally on this device.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/Social-Atlas-Setup-0.1.0.exe
            renderer.bundle.js
            launcher/dist/Social-Atlas-Launcher-Setup-1.0.0.exe

name: Build Windows desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Deliberately do not enable setup-node's npm cache here:
      # this repository currently has no package-lock.json.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win

      # Preserve a downloadable installer even if publishing the release fails.
      - name: Upload installer build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Social-Atlas-Windows-Installer
          path: dist/Social-Atlas-Setup-0.1.0.exe
            renderer.bundle.js
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Social Atlas v0.1.${{ github.run_number }}
          body: |
            Automated Windows desktop build of Social Atlas with a movable 3D social network graph.

            **Install:** Download the Windows installer below and run it.
            This is an early preview. Your people, relationship, and event data are stored locally in the app's Electron storage.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/Social-Atlas-Setup-0.1.0.exe

name: Build Windows desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # No npm cache: this repository intentionally has no committed lockfile.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win

      # Upload both outputs so the installer is available even if release publishing fails.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Social-Atlas-Windows-Build
          path: |
            dist/Social-Atlas-Setup-0.1.0.exe
            renderer.bundle.js
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer and update bundle to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Social Atlas v0.1.${{ github.run_number }}
          body: |
            Automated Windows desktop build of Social Atlas with a movable 3D social network graph.

            **Install:** Download the Windows installer below and run it.
            The renderer bundle is also published for in-app frontend updates.
            This is an early preview. Your people, relationship, and event data are stored locally on this device.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/Social-Atlas-Setup-0.1.0.exe
            renderer.bundle.js
